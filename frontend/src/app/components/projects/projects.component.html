<section class="projects">
  <div class="container">
    <h2>My Projects</h2>
    
    <div *ngIf="loading" class="loading">Loading projects...</div>
    
    <div *ngIf="!loading && projects.length === 0" class="no-projects">
      No projects yet. Check back soon!
    </div>
    
    <div class="projects-grid">
      <div *ngFor="let project of projects" class="project-card">
        <div class="project-image" *ngIf="project.image">
          <img [src]="project.image" [alt]="project.title">
        </div>
        <div class="project-content">
          <h3>{{ project.title }}</h3>
          <p>{{ project.description }}</p>
          <div class="technologies">
            <span *ngFor="let tech of project.technologies" class="tech-badge">
              {{ tech }}
            </span>
          </div>
          <div class="project-links">
            <a *ngIf="project.link" [href]="project.link" target="_blank">Live Demo</a>
            <a *ngIf="project.github" [href]="project.github" target="_blank">GitHub</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
