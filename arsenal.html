<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arsenal :: tanathorn</title>
    <meta name="description" content="Tanathorn's arsenal — tools and technologies.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="view" class="page">
        <section id="arsenal" class="section arsenal">
            <div class="container">
                <p class="page-crumb">visitor@tanathorn:<span class="accent">~/arsenal</span>$ ls tools/</p>
                <h2 class="section-title" data-index="04"><span class="hash">#</span> arsenal <span class="title-sub">// tools &amp; tech</span></h2>
                <div class="arsenal-grid">
                    <!-- EDIT each group's title + tags -->
                    <div class="arsenal-card reveal">
                        <h3 class="arsenal-cat">recon &amp; scanning</h3>
                        <div class="tags">
                            <span class="tag">nmap</span><span class="tag">masscan</span>
                            <span class="tag">gobuster</span><span class="tag">ffuf</span>
                            <span class="tag">amass</span><span class="tag">nuclei</span>
                        </div>
                    </div>
                    <div class="arsenal-card reveal">
                        <h3 class="arsenal-cat">exploitation</h3>
                        <div class="tags">
                            <span class="tag">metasploit</span><span class="tag">burp suite</span>
                            <span class="tag">sqlmap</span><span class="tag">hydra</span>
                            <span class="tag">john</span><span class="tag">hashcat</span>
                        </div>
                    </div>
                    <div class="arsenal-card reveal">
                        <h3 class="arsenal-cat">post-exploitation</h3>
                        <div class="tags">
                            <span class="tag">mimikatz</span><span class="tag">bloodhound</span>
                            <span class="tag">impacket</span><span class="tag">linpeas</span>
                            <span class="tag">winpeas</span>
                        </div>
                    </div>
                    <div class="arsenal-card reveal">
                        <h3 class="arsenal-cat">languages &amp; os</h3>
                        <div class="tags">
                            <span class="tag">python</span><span class="tag">bash</span>
                            <span class="tag">powershell</span><span class="tag">kali linux</span>
                            <span class="tag">c</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
